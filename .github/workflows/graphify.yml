name: graphify

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'  # every Monday at 4am UTC

jobs:
  build-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install graphify
        run: pip install "git+https://github.com/safishamsi/graphify.git@v8" openai -q

      - name: Merge .gitignore into .graphifyignore
        run: [ -f .gitignore ] && cat .gitignore >> .graphifyignore || true

      - name: Build graph
        env:
          OLLAMA_BASE_URL: https://openrouter.ai/api/v1
          OLLAMA_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OLLAMA_MODEL: openai/gpt-4o-mini
        run: graphify . --no-viz --backend ollama

      - name: Commit graph to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f graphify-out/graph.json graphify-out/GRAPH_REPORT.md graphify-out/cost.json graphify-out/manifest.json
          git diff --cached --quiet || git commit -m "chore: update knowledge graph [skip ci]"
          git push origin main

      - name: Generate HTML
        run: graphify export html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./graphify-out
          destination_dir: graphify-out
          keep_files: true
